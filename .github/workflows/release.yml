name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Opt into Node.js 24 for all actions ahead of the June 2, 2026 forced migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          # darwin/arm64 — native macOS Apple Silicon runner
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary: neurollama-darwin-arm64
          # darwin/amd64 — cross-compiled from Linux (CGO_ENABLED=0, no macos-13 runner needed)
          - os: ubuntu-latest
            goos: darwin
            goarch: amd64
            binary: neurollama-darwin-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: neurollama-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            binary: neurollama-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      # CSS is pre-built and committed — no Node/npm needed.
      # To rebuild locally after style changes:
      #   ./tailwindcss -i tailwind/input.css -o static/css/output.css --minify

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o ${{ matrix.binary }} .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
