name: Release

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'

permissions:
  contents: write

# Opt into Node.js 24 for all actions ahead of the June 2, 2026 forced migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Compile check on every dev push (no release) ─────────────────────────
  build-check:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Compile check
        env:
          CGO_ENABLED: 0
        run: go build -o /dev/null .

  # ── Detect whether the tag commit is on main (stable vs pre-release) ─────
  check-stable:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is this commit on main?
        id: check
        run: |
          git fetch origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Build release binaries ────────────────────────────────────────────────
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check-stable
    strategy:
      matrix:
        include:
          # darwin/arm64 — native macOS Apple Silicon runner
          - os: macos-latest
            goos: darwin
            goarch: arm64
            binary: neurollama-darwin-arm64
          # darwin/amd64 — cross-compiled from Linux (CGO_ENABLED=0, no macos-13 runner needed)
          - os: ubuntu-latest
            goos: darwin
            goarch: amd64
            binary: neurollama-darwin-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: neurollama-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            binary: neurollama-linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      # CSS is pre-built and committed — no Node/npm needed.
      # To rebuild locally after style changes:
      #   ./tailwindcss -i tailwind/input.css -o static/css/output.css --minify

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          RELEASE_TYPE: ${{ needs.check-stable.outputs.prerelease == 'true' && 'pre-release' || 'stable' }}
        run: go build -ldflags="-s -w -X main.releaseType=${RELEASE_TYPE}" -o ${{ matrix.binary }} .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary }}
          generate_release_notes: true
          prerelease: ${{ needs.check-stable.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
