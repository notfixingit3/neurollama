{{define "server-list"}}
{{if .}}
  {{range .}}
    <li>
      <div class="flex items-start justify-between gap-3 rounded-box p-2">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span class="truncate font-semibold">{{.Name}}</span>
            {{if .IsCurrent}}<span class="badge badge-primary badge-xs">current</span>{{end}}
          </div>
          <div class="truncate text-xs opacity-60">{{.BaseURL}}</div>
        </div>

        <div class="join shrink-0">
          <button type="button"
                  class="btn btn-primary btn-xs join-item"
                  hx-post="/servers/{{.ID | urlquery}}/select"
                  hx-target="#dashboard-server-list"
                  hx-swap="innerHTML"
                  hx-on::after-request="htmx.trigger('#model-list', 'refreshModels')">
            Use
          </button>
          <button type="button" class="btn btn-ghost btn-xs join-item" onclick="document.getElementById('edit-server-{{.ID}}').showModal()">
            Edit
          </button>
          <button type="button"
                  class="btn btn-error btn-xs join-item"
                  hx-delete="/servers/{{.ID | urlquery}}"
                  hx-target="#dashboard-server-list"
                  hx-swap="innerHTML"
                  hx-confirm="Delete {{.Name}}?">
            Delete
          </button>
        </div>
      </div>

      <dialog id="edit-server-{{.ID}}" class="modal">
        <div class="modal-box">
          <h3 class="text-lg font-bold">Edit server</h3>
          <form class="mt-4 space-y-4"
                hx-put="/servers/{{.ID | urlquery}}"
                hx-target="#dashboard-server-list"
                hx-swap="innerHTML">
            <label class="form-control w-full">
              <span class="label-text">Name</span>
              <input type="text" name="name" value="{{.Name}}" class="input input-bordered w-full" required>
            </label>
            <label class="form-control w-full">
              <span class="label-text">Base URL</span>
              <input type="url" name="baseURL" value="{{.BaseURL}}" class="input input-bordered w-full" required>
            </label>
            <div class="modal-action">
              <button type="button" class="btn btn-ghost" onclick="document.getElementById('edit-server-{{.ID}}').close()">Cancel</button>
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
          </form>
        </div>
        <form method="dialog" class="modal-backdrop">
          <button type="submit">close</button>
        </form>
      </dialog>
    </li>
  {{end}}
{{else}}
  <li>
    <div class="rounded-box p-3 text-sm opacity-70">No servers configured.</div>
  </li>
{{end}}
{{end}}

{{define "server_list"}}{{template "server-list" .}}{{end}}
