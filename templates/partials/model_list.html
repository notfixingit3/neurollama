{{define "model_list"}}
<form id="model-list-form">
  {{if .Models}}
    <div class="overflow-x-auto rounded-box border border-base-300 bg-base-100">
      <table class="table table-zebra">
        <thead>
          <tr>
            <th class="w-10">
              <span class="sr-only">Select</span>
            </th>
            <th>Name</th>
            <th>Quantization</th>
            <th class="text-right">Size</th>
            <th class="w-24 text-right">Details</th>
          </tr>
        </thead>
        {{range .Models}}
          <tbody>
            <tr class="hover cursor-pointer"
                hx-get="/models/{{.Name | urlquery}}/detail"
                hx-target="next .model-detail-row"
                hx-swap="outerHTML">
              <td onclick="event.stopPropagation()">
                <input type="checkbox" name="names[]" value="{{.Name}}" class="checkbox checkbox-sm checkbox-primary">
              </td>
              <td>
                <div class="font-semibold">{{.Name}}</div>
              </td>
              <td>
                <span class="badge badge-outline">{{.Quant}}</span>
              </td>
              <td class="text-right tabular-nums">{{.SizeString}}</td>
              <td class="text-right">
                <button type="button" class="btn btn-ghost btn-xs">Expand</button>
              </td>
            </tr>
            <tr class="model-detail-row">
              <td colspan="5" class="bg-base-200 p-0"></td>
            </tr>
          </tbody>
        {{end}}
      </table>
    </div>
  {{else}}
    <div class="hero rounded-box bg-base-100 py-12">
      <div class="hero-content text-center">
        <div class="max-w-md">
          <h3 class="text-xl font-bold">No models found</h3>
          <p class="py-3 text-sm opacity-70">Pull a model to add it to this server.</p>
          <span class="badge badge-secondary">Empty library</span>
        </div>
      </div>
    </div>
  {{end}}
</form>
{{end}}

{{define "content"}}{{template "model_list" .}}{{end}}
